name: Weekly nflverse oline

on:
  schedule:
    # Saturday 14:37 UTC — pre-Sunday OL state; off-the-hour (playerstats [advstats+gamelogs]
    # Sat 13:47, playerstate Sat 14:11). Upstream ESPN charts refresh daily ~07:30 UTC.
    - cron: "37 14 * * 6"
  workflow_dispatch: {}   # manual trigger for backfill / corrections

permissions:
  contents: write

jobs:
  oline:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: oline
      sparse-paths: nflverse/oline
      commit-scope: "nflverse/"
      commit-message: "nflverse: oline"
      purge-path: "nflverse/oline/<season>.json"
      season-keyed: true
