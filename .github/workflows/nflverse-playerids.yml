name: Weekly nflverse playerids

on:
  schedule:
    # Wednesday 13:29 UTC — staggered from KTC (Mon 13:17) and roster (Tue 13:23)
    # so the weekly committers don't race the push to main.
    - cron: "29 13 * * 3"
  workflow_dispatch: {}   # allow manual trigger for testing / backfill

permissions:
  contents: write

jobs:
  playerids:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: playerids
      sparse-paths: nflverse/playerids.json
      commit-scope: "nflverse/"
      commit-message: "nflverse: playerids"
      purge-path: "nflverse/playerids.json"
