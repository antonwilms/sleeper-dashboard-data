name: Weekly KTC snapshot

on:
  schedule:
    # Monday 13:17 UTC (~9:17am ET) — off-the-hour to be polite to shared GHA runners.
    # Well after KTC's overnight value updates.
    - cron: "17 13 * * 1"
  workflow_dispatch: {}   # allow manual trigger for testing

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # listDir('ktc') finds the previous snapshot; quarantine/ is a write-only path but
          # still needs to be in the cone for `git add` after cone-mode narrowing (ci-consolidation.md §2.3).
          sparse-checkout: |
            lib
            scripts
            bin
            manifest.json
            package.json
            package-lock.json
            ktc
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Capture KTC snapshot
        id: capture
        run: node bin/update.mjs ktc

      - name: Commit and purge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            SNAPSHOT_DATE=$(date -u +%Y-%m-%d)
            git add ktc/ manifest.json
            git commit -m "ktc: snapshot ${SNAPSHOT_DATE}"
            # Retry with rebase on push rejection (multiple weekly committers on main)
            git push || (git pull --rebase && git push)
            # Purge jsDelivr CDN cache so new snapshot is visible without waiting for TTL
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/manifest.json" || true
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/ktc/snapshot-${SNAPSHOT_DATE}.json" || true
          else
            echo "No changes to commit."
          fi

      - name: Fail if snapshot was quarantined
        if: steps.capture.outputs.quarantined == 'true'
        run: |
          echo "::error::KTC snapshot quarantined for review: ${{ steps.capture.outputs.quarantine_reason }}"
          exit 1
