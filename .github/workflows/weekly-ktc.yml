name: Weekly KTC snapshot

on:
  schedule:
    # Monday 13:17 UTC (~9:17am ET) — off-the-hour to be polite to shared GHA runners.
    # Well after KTC's overnight value updates.
    - cron: "17 13 * * 1"
    # Retries, Tue + Wed same time: the "Skip if this week is captured" step no-ops them once
    # Monday (or an earlier retry) captured cleanly. Added after the 2026-10-05 run died with
    # "job was not acquired by Runner" and the week was lost (.claude/tasks/ktc-capture-hardening.md).
    - cron: "17 13 * * 2"
    - cron: "17 13 * * 3"
  workflow_dispatch: {}   # allow manual trigger for testing

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # listDir('ktc') finds the previous snapshot; quarantine/ is a write-only path but
          # still needs to be in the cone for `git add` after cone-mode narrowing (ci-consolidation.md §2.3).
          sparse-checkout: |
            lib
            scripts
            bin
            manifest.json
            package.json
            package-lock.json
            ktc
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Scheduled runs only — a manual dispatch always captures.
      - name: Skip if this week is captured
        id: week
        if: github.event_name == 'schedule'
        run: node -e "import('./scripts/update-ktc.mjs').then(m => m.ktcWeekStep())"

      - name: Capture KTC snapshot
        id: capture
        if: steps.week.outputs.captured != 'true'
        run: node bin/update.mjs ktc

      - name: Commit and purge if changed
        if: steps.week.outputs.captured != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            SNAPSHOT_DATE=$(date -u +%Y-%m-%d)
            git add ktc/ manifest.json
            git commit -m "ktc: snapshot ${SNAPSHOT_DATE}"
            # Retry with rebase on push rejection (multiple weekly committers on main)
            git push || (git pull --rebase && git push)
            # Purge jsDelivr via bin/purge-cdn.mjs (verifies, manifest last). A quarantined
            # capture writes ktc/quarantine/, not ktc/, so the snapshot path may not exist.
            if [[ -f "ktc/snapshot-${SNAPSHOT_DATE}.json" ]]; then
              node bin/purge-cdn.mjs "ktc/snapshot-${SNAPSHOT_DATE}.json"
            else
              node bin/purge-cdn.mjs
            fi
          else
            echo "No changes to commit."
          fi

      - name: Fail if snapshot was quarantined
        if: always() && steps.capture.outputs.quarantined == 'true'
        run: |
          echo "::error::KTC snapshot quarantined for review: ${{ steps.capture.outputs.quarantine_reason }}"
          exit 1
