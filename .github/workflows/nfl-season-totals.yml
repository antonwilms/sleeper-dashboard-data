name: Weekly NFL season totals

on:
  schedule:
    # Fri, Mon and Tue at 06:13 UTC (season-totals-cadence.md). Each run lands a game window a few
    # hours after it ends: Fri = Thursday night (+ midweek stat corrections to the prior week),
    # Mon = Sat/Sun, Tue = Monday night — after Tuesday's run the week is complete for every team.
    # Between Fri and Tue the in-progress file holds a partly played current week (teams that have
    # played it carry one more gamesPlayed) — CR-21. 06:13 is clear of every committer (KTC 13:17
    # Mon, roster 13:23 Tue, schedule 13:35 Fri); cron-deadman (05:19) and registry-mirror (06:41)
    # commit nothing. Reads nflverse/schedule/<year>.json for D-1 bye inference; the season's
    # schedule is written long before week 1, so the Friday schedule job's timing does not matter.
    # Also reads nflverse/rosterweekly/<year>.json (refreshed daily at 06:23 UTC, after this job, so
    # classification lags one run) for absence classification (CR-28).
    - cron: "13 6 * * 1,2,5"
  workflow_dispatch: {}   # allow manual trigger for backfill / corrections

permissions:
  contents: write

jobs:
  season-totals:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: nfl
      # nflverse/schedule is a cross-family read, not a directory-name guess: update-nfl.mjs
      # reads nflverse/schedule/<year>.json for D-1 bye inference on every in-season run
      # (readJson returns null on a missing file rather than throwing — a missing cone entry
      # here would degrade silently, not fail loudly). ci-consolidation.md §2.3.
      sparse-paths: |
        nfl/season-totals
        nflverse/schedule
        nflverse/rosterweekly
      commit-scope: "nfl/"
      commit-message: "nfl: season-totals"
      purge-path: "nfl/season-totals/<season>.json"
      season-keyed: true
