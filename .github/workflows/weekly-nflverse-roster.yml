name: Weekly nflverse roster

on:
  schedule:
    # Tuesday 13:23 UTC — off-the-hour, staggered from KTC (Monday 13:17) so
    # the two weekly committers don't race the push to main.
    - cron: "23 13 * * 2"
  workflow_dispatch: {}   # allow manual trigger for testing / backfill

permissions:
  contents: write

jobs:
  roster:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: roster
      sparse-paths: nflverse/roster
      commit-scope: "nflverse/"
      commit-message: "nflverse: roster"
      purge-path: "nflverse/roster/<season>.json"
      season-keyed: true
