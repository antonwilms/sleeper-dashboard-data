name: Weekly nflverse roster

on:
  schedule:
    # Tuesday 13:23 UTC — off-the-hour, staggered from KTC (Monday 13:17) so
    # the two weekly committers don't race the push to main.
    - cron: "23 13 * * 2"
  workflow_dispatch: {}   # allow manual trigger for testing / backfill

permissions:
  contents: write

jobs:
  roster:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch nflverse roster
        run: node bin/update.mjs roster

      - name: Commit and purge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add nflverse/ manifest.json
            git commit -m "nflverse: roster $(date -u +%Y-%m-%d)"
            # Retry with rebase on push rejection (multiple weekly committers on main)
            git push || (git pull --rebase && git push)
            # Purge jsDelivr CDN cache so weekly freshness isn't stuck behind @main cache
            YEAR=$(date -u +%Y)
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/manifest.json" || true
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/nflverse/roster/${YEAR}.json" || true
          else
            echo "No changes to commit."
          fi
