name: Weekly nflverse teamcontext

on:
  schedule:
    # Sunday 13:53 UTC — the only free weekday slot (Mon KTC / Tue roster / Wed playerids /
    # Fri schedule / Sat playerstats [advstats+gamelogs]); runs before Sunday kickoffs, so week N
    # lands complete on the FOLLOWING Sunday (pbp for MNF settles Tue — any day ≥ Wed has the full
    # prior week; acceptable one-week latency for a weekly pack). No crosswalk dependency
    # (team-keyed family) — unlike gamelogs, no ordering constraint on the playerids Action.
    - cron: "53 13 * * 0"
  workflow_dispatch: {}   # allow manual trigger for backfill / corrections

permissions:
  contents: write

jobs:
  teamcontext:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: teamcontext
      sparse-paths: nflverse/teamcontext
      commit-scope: "nflverse/"
      commit-message: "nflverse: teamcontext"
      purge-path: "nflverse/teamcontext/<season>.json"
      season-keyed: true
