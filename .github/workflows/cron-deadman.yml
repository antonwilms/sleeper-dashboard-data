name: Cron dead-man detector

on:
  schedule:
    # Daily 05:19 UTC — quiet slot, well clear of the 13:xx-14:xx capture crons; a missed
    # scheduler tick self-heals the next day.
    - cron: "19 5 * * *"
  push:
    branches: [main]   # human pushes re-arm the detector even if all crons are dead;
                       # GITHUB_TOKEN pushes from capture Actions do not trigger this (no recursion)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  deadman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check-crons.mjs reads .github/workflows/*.yml FROM DISK at runtime
          # (listScheduledWorkflows → listDir/readFileSync) — it must be listed explicitly.
          # Verified empirically: cone-mode sparse-checkout does NOT auto-include .github/ the
          # way it auto-includes loose files at each listed directory's own level; omitting it
          # here would make listDir('.github/workflows') return [], so the detector would find
          # zero scheduled workflows and report zero failures — a silent false all-clear, not a
          # loud failure. No data file, no manifest.json needed otherwise (ci-consolidation.md §2.3).
          sparse-checkout: |
            lib
            scripts
            bin
            package.json
            package-lock.json
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check scheduled captures ran
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/deadman.mjs
