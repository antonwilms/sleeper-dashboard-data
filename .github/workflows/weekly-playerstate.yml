name: Weekly players-state snapshot

on:
  schedule:
    # Saturday 14:11 UTC — after Friday injury designations, before Sunday games.
    # Off-the-hour to be polite to shared GHA runners; playerstats (advstats+gamelogs) runs Sat 13:47.
    - cron: "11 14 * * 6"
  workflow_dispatch: {}   # manual trigger for testing / immediate first capture

permissions:
  contents: write

jobs:
  playerstate:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: playerstate
      sparse-paths: nfl/players-state
      commit-scope: "nfl/players-state/"
      commit-message: "playerstate: snapshot"
      purge-path: "nfl/players-state/<date>.json"
