name: Weekly nflverse schedule

on:
  schedule:
    # Friday 13:35 UTC — after the week's Thu/Sun/Mon results settle and next week's
    # lines post. Off-hour :35, distinct day from KTC (Mon), roster (Tue), playerids
    # (Wed), playerstats/advstats+gamelogs (Sat) so weekly committers don't race the push to main.
    - cron: "35 13 * * 5"
  workflow_dispatch: {}   # manual trigger for backfill / corrections

permissions:
  contents: write

jobs:
  schedule:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: schedule
      sparse-paths: nflverse/schedule
      commit-scope: "nflverse/"
      commit-message: "nflverse: schedule"
      purge-path: "nflverse/schedule/<season>.json"
      season-keyed: true
