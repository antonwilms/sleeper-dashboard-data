name: Weekly nflverse advstats

on:
  schedule:
    # Thursday 13:41 UTC — must run AFTER the Wednesday playerids Action (13:29) so
    # the re-key joins the freshest crosswalk committed to main. Also after roster
    # (Tue 13:23). nflverse player-stats land Tue/Wed post-games, so Thursday is
    # fresh on both inputs. Off-hour :41, distinct day → no race with other committers.
    - cron: "41 13 * * 4"
  workflow_dispatch: {}   # allow manual trigger for backfill / corrections

permissions:
  contents: write

jobs:
  advstats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch nflverse advstats
        id: fetch
        run: node bin/update.mjs advstats

      - name: Commit and purge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add nflverse/ manifest.json
            git commit -m "nflverse: advstats $(date -u +%Y-%m-%d)"
            # Retry with rebase on push rejection (multiple weekly committers on main)
            git push || (git pull --rebase && git push)
            # Purge jsDelivr CDN cache. SEASON is the NFL season resolved by the node step
            # (the year the advstats file is keyed by), NOT the calendar year — they diverge
            # Jan–Feb. See scripts/update-advstats.mjs (setStepOutput).
            SEASON="${{ steps.fetch.outputs.season }}"
            curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/manifest.json" || true
            if [[ -n "$SEASON" ]]; then
              curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/sleeper-dashboard-data@main/nflverse/advstats/${SEASON}.json" || true
            else
              echo "WARN: season step-output empty; skipped season-keyed advstats purge"
            fi
          else
            echo "No changes to commit."
          fi
