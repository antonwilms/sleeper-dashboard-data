name: nflverse draft picks

on:
  schedule:
    # May 1 at 12:00 UTC — after the NFL draft (late April); re-run manually
    # if nflverse publishes a correction after the initial ingest.
    - cron: "0 12 1 5 *"
  workflow_dispatch: {}   # allow manual trigger for corrections / backfill

permissions:
  contents: write

jobs:
  draft:
    uses: ./.github/workflows/_ingest.yml
    with:
      subcommand: draft
      sparse-paths: nflverse/draft
      commit-scope: "nflverse/"
      commit-message: "nflverse: draft picks"
      purge-path: "nflverse/draft/draft_picks.json"
